<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abby Whitsitt — Class of 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,500&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100vw; height:100vh; overflow:hidden; }

body {
  --gold:#F0C040; --gold2:#C9973A; --bg:#0a0a0f; --text:#FDF8EE; --text2:rgba(253,248,238,0.6);
  --badge-bg:rgba(10,10,15,0.92); --badge-border:#C9973A;
  --p1:#F0C040; --p2:#E8407A; --p3:#7B61FF; --p4:#42D9C8;
  --font-d:'Cormorant Garamond',serif; --font-t:'Cinzel',serif; --font-b:'Lato',sans-serif;
  background:var(--bg); font-family:var(--font-b); font-weight:300; cursor:none;
}
body.theme-rose      { --bg:#1a0a0d; --text:#FDF0F2; --gold:#E8A0B0; --gold2:#C97080; --badge-bg:rgba(26,10,13,0.92); --badge-border:#C97080; --p1:#E8A0B0; --p2:#F5C5CF; --p3:#C97080; --p4:#FFE4E8; }
body.theme-navy      { --bg:#050a1a; --text:#E8EFF8; --gold:#C0D0E8; --gold2:#8098B8; --badge-bg:rgba(5,10,26,0.92); --badge-border:#8098B8; --p1:#C0D0E8; --p2:#E8EFF8; --p3:#8098B8; --p4:#4060A0; }
body.theme-editorial { --bg:#0f0f0f; --text:#F0F0F0; --gold:#F0F0F0; --gold2:#A0A0A0; --badge-bg:rgba(0,0,0,0.95); --badge-border:#505050; --p1:#F0F0F0; --p2:#A0A0A0; --p3:#606060; --p4:#D0D0D0; }
body.theme-summer    { --bg:#0a1510; --text:#F0FFF4; --gold:#60D890; --gold2:#40A860; --badge-bg:rgba(10,21,16,0.92); --badge-border:#40A860; --p1:#60D890; --p2:#40C8C0; --p3:#F0C040; --p4:#E87040; }
body.theme-christmas { --bg:#0a1a08; --text:#FFF8F0; --gold:#F0C040; --gold2:#C83020; --badge-bg:rgba(10,26,8,0.92); --badge-border:#C83020; --p1:#E83020; --p2:#F0C040; --p3:#FFFFFF; --p4:#40A830; }
body.theme-july4     { --bg:#08081a; --text:#F8F8FF; --gold:#E8E8F0; --gold2:#A0A0D0; --badge-bg:rgba(8,8,26,0.92); --badge-border:#E83020; --p1:#E83020; --p2:#F8F8FF; --p3:#2040C8; --p4:#F0C040; }
body.theme-halloween { --bg:#0a0500; --text:#FFF0E0; --gold:#F0A030; --gold2:#C06010; --badge-bg:rgba(10,5,0,0.92); --badge-border:#C06010; --p1:#F0A030; --p2:#E87020; --p3:#800080; --p4:#FFFFFF; }
body.theme-valentine { --bg:#1a0810; --text:#FFF0F4; --gold:#F090A8; --gold2:#C84060; --badge-bg:rgba(26,8,16,0.92); --badge-border:#C84060; --p1:#E84060; --p2:#F090A8; --p3:#FF6688; --p4:#FFB0C0; }
body.theme-spring    { --bg:#080f0a; --text:#F0FFF0; --gold:#A0E080; --gold2:#60A840; --badge-bg:rgba(8,15,10,0.92); --badge-border:#60A840; --p1:#A0E080; --p2:#E0A0C0; --p3:#80C860; --p4:#F0E060; }

/* ── Canvas & Chrome ── */
#particle-canvas { position:fixed; inset:0; pointer-events:none; z-index:50; }

#loading { position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; transition:opacity 1s ease; }
#loading.gone { opacity:0; pointer-events:none; }
#loading h2 { font-family:var(--font-t); font-size:1rem; letter-spacing:.4em; color:var(--gold2); text-transform:uppercase; }
#loading-bar-wrap { width:260px; height:2px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
#loading-bar { height:100%; width:0%; background:linear-gradient(to right,var(--gold2),var(--gold)); transition:width .3s ease; }
#loading-status { font-size:.6rem; letter-spacing:.25em; color:var(--text2); text-transform:uppercase; }

#splash { position:fixed; inset:0; z-index:70; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; transition:opacity 1.5s ease; }
#splash.gone { opacity:0; pointer-events:none; }
#splash .s-eye { font-family:var(--font-t); font-size:clamp(.55rem,1.5vw,.7rem); letter-spacing:.5em; color:var(--gold2); text-transform:uppercase; margin-bottom:.5rem; }
#splash h1 { font-family:var(--font-d); font-size:clamp(4rem,10vw,9rem); font-weight:300; color:var(--text); line-height:1; text-align:center; }
#splash h1 em { font-style:italic; color:var(--gold); display:block; }
#splash .s-sub { font-family:var(--font-t); font-size:clamp(.55rem,1.5vw,.75rem); letter-spacing:.4em; color:var(--text2); text-transform:uppercase; margin-top:.5rem; }
.s-star { position:absolute; color:var(--gold); opacity:0; animation:sp 3s ease-in-out infinite; }
@keyframes sp { 0%,100%{opacity:0;transform:scale(.5)} 50%{opacity:.7;transform:scale(1)} }

#outro { position:fixed; inset:0; z-index:70; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; opacity:0; transition:opacity 1.5s ease; }
#outro.visible { opacity:1; }
#outro h1 { font-family:var(--font-d); font-style:italic; font-size:clamp(3rem,8vw,7rem); color:var(--gold); line-height:1; text-align:center; }
#outro p { font-family:var(--font-t); font-size:clamp(.55rem,1.5vw,.75rem); letter-spacing:.4em; color:var(--text2); text-transform:uppercase; }

/* ── Slideshow ── */
#show { position:relative; width:100%; height:100%; }

.slide {
  position:absolute; inset:0; opacity:0;
  transition:opacity 1.4s ease;
  background:var(--bg);
}
.slide.active { opacity:1; z-index:1; }

/* ── Photo cell — absolute positioned ── */
.cell {
  position:absolute;
  overflow:hidden;
  border-radius:3px;
  background:var(--bg);
}
.cell img {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  transition:transform 9s ease;
}
.slide.active .cell img { transform:scale(1.02); }

/* ── Badge cell ── */
.badge {
  position:absolute;
  background:var(--badge-bg);
  border:1px solid var(--badge-border);
  border-radius:4px;
  padding:1.2rem 1.8rem;
  text-align:center;
  backdrop-filter:blur(12px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
.badge::before { content:'✦'; position:absolute; top:6px; left:8px; color:var(--gold); font-size:.5rem; opacity:.6; }
.badge::after  { content:'✦'; position:absolute; bottom:6px; right:8px; color:var(--gold); font-size:.5rem; opacity:.6; }
.b-cap  { font-size:1.6rem; display:block; margin-bottom:.2rem; }
.b-co   { font-family:var(--font-t); font-size:.5rem; letter-spacing:.35em; color:var(--gold); text-transform:uppercase; display:block; margin-bottom:.2rem; }
.b-grad { font-family:var(--font-d); font-style:italic; font-size:2.2rem; color:var(--gold); line-height:1; display:block; text-shadow:0 0 20px rgba(255,255,255,.15); }
.b-name { font-family:var(--font-t); font-size:.65rem; letter-spacing:.18em; color:var(--text); display:block; margin-top:.35rem; text-transform:uppercase; }
.b-tag  { font-size:.42rem; letter-spacing:.25em; color:var(--gold2); text-transform:uppercase; display:block; margin-top:.4rem; padding-top:.4rem; border-top:1px solid rgba(255,255,255,.12); }
.b-msg  { font-family:var(--font-d); font-style:italic; font-size:1.05rem; color:var(--text); line-height:1.45; display:block; margin-top:.3rem; }
.b-from { font-size:.48rem; letter-spacing:.2em; color:var(--gold2); text-transform:uppercase; display:block; margin-top:.3rem; }

/* ── Then & Now ── */
.slide.then-now .cell-old { position:absolute; left:1%; top:1%; width:48.5%; height:85%; overflow:hidden; border-radius:3px; }
.slide.then-now .cell-new { position:absolute; left:50.5%; top:1%; width:48.5%; height:85%; overflow:hidden; border-radius:3px; }
.slide.then-now .cell-old img,
.slide.then-now .cell-new img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; display:block; transition:transform 9s ease; }
.slide.then-now.active .cell-old img,
.slide.then-now.active .cell-new img { transform:scale(1.04); }
.slide.then-now .tn-label { position:absolute; bottom:1%; left:0; right:0; text-align:center; display:flex; align-items:center; justify-content:center; gap:1.5rem; padding:.8rem; }
.tn-word { font-family:var(--font-t); font-size:.65rem; letter-spacing:.35em; color:var(--gold); text-transform:uppercase; }
.tn-line { flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold2),transparent); opacity:.4; max-width:200px; }
.tn-arrow { color:var(--gold2); font-size:1.4rem; }

/* ── Featured photo (full bleed) ── */
.slide.featured-photo .feat-img { position:absolute; inset:0; overflow:hidden; }
.slide.featured-photo .feat-img img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; display:block; transition:transform 12s ease; }
.slide.featured-photo.active .feat-img img { transform:scale(1.03); }
.feat-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.88) 0%,rgba(0,0,0,0.1) 50%,transparent 100%); }
.feat-text { position:absolute; bottom:0; left:0; right:0; padding:3rem 4rem; }
.feat-message { font-family:var(--font-d); font-style:italic; font-size:clamp(1.3rem,3.5vw,2.2rem); color:var(--text); line-height:1.5; margin-bottom:1rem; text-shadow:0 2px 15px rgba(0,0,0,0.6); }
.feat-from { font-family:var(--font-t); font-size:.65rem; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; }
.feat-divider { width:50px; height:1px; background:var(--gold2); margin-bottom:.8rem; opacity:.6; }

/* ── Guest wall ── */
.slide.guest-wall { display:flex; flex-direction:column; padding:2rem 3rem; gap:0; }
.guest-wall-header { text-align:center; padding:1rem 0 1.5rem; flex-shrink:0; }
.guest-wall-header h2 { font-family:var(--font-d); font-style:italic; font-size:clamp(1.8rem,4vw,3rem); color:var(--gold); }
.guest-wall-header p { font-family:var(--font-t); font-size:.55rem; letter-spacing:.3em; color:var(--text2); text-transform:uppercase; margin-top:.3rem; }
.guest-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; flex:1; }
.guest-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:4px; padding:1rem 1.2rem; display:flex; flex-direction:column; gap:.5rem; overflow:hidden; }
.gc-message { font-family:var(--font-d); font-style:italic; font-size:clamp(.85rem,1.6vw,1.05rem); color:var(--text); line-height:1.5; flex:1; }
.gc-from { font-family:var(--font-t); font-size:.48rem; letter-spacing:.2em; color:var(--gold2); text-transform:uppercase; }
.gc-rel { font-size:.45rem; color:var(--text2); letter-spacing:.1em; }

/* ── UI Chrome ── */
#counter { position:fixed; bottom:1rem; right:1.5rem; z-index:20; font-size:.55rem; letter-spacing:.3em; color:rgba(255,255,255,.25); text-transform:uppercase; }
#progress { position:fixed; bottom:0; left:0; height:2px; z-index:20; background:linear-gradient(to right,var(--gold2),var(--gold)); width:0%; }
#theme-indicator { position:fixed; top:1rem; left:1rem; z-index:20; font-size:.48rem; letter-spacing:.2em; color:rgba(255,255,255,.18); text-transform:uppercase; }
#dots { position:fixed; top:50%; right:1rem; transform:translateY(-50%); z-index:20; display:flex; flex-direction:column; gap:5px; max-height:70vh; overflow:hidden; }
.dot { width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.15); cursor:pointer; transition:all .3s; flex-shrink:0; }
.dot.active { background:var(--gold); transform:scale(1.8); }
#error-screen { position:fixed; inset:0; z-index:90; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:1rem; padding:2rem; text-align:center; }
#error-screen h2 { font-family:var(--font-t); color:var(--gold); font-size:1.2rem; letter-spacing:.2em; }
#error-screen p { color:var(--text2); font-size:.8rem; line-height:1.8; max-width:500px; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div id="loading">
  <h2>Loading Abby's Story</h2>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-status">Connecting...</div>
</div>

<div id="error-screen">
  <h2>⚠ Could Not Load</h2>
  <p id="error-detail">Check Drive folder sharing and API key.</p>
</div>

<div id="splash">
  <div class="s-star" style="top:12%;left:8%;animation-delay:0s;font-size:.9rem">✦</div>
  <div class="s-star" style="top:15%;right:10%;animation-delay:.4s;font-size:.7rem">★</div>
  <div class="s-star" style="bottom:20%;left:6%;animation-delay:.8s;font-size:.8rem">✦</div>
  <div class="s-star" style="bottom:18%;right:8%;animation-delay:1.2s;font-size:.6rem">★</div>
  <div class="s-star" style="top:45%;left:4%;animation-delay:.6s;font-size:.7rem">✦</div>
  <div class="s-star" style="top:40%;right:5%;animation-delay:.2s;font-size:.9rem">★</div>
  <div class="s-eye">Celebrating</div>
  <h1>Abby<em>Whitsitt</em></h1>
  <div class="s-sub">Class of 2026 · Graduation Party</div>
</div>

<div id="outro">
  <h1>Abby Whitsitt</h1>
  <p>Class of 2026</p>
</div>

<div id="show"></div>
<div id="dots"></div>
<div id="counter"></div>
<div id="progress"></div>
<div id="theme-indicator"></div>

<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const CONFIG = {
  name:'Abby Whitsitt', year:'Class of 2026',
  apiKey:'AIzaSyD1dmwLLb63ePWsWUz_FRRK4n89wxPod6Q',
  mainFolderId:'1-8Y2OJeaGlWjhBvcPRMW6xuqbwscj3tP',
  subFolderId:'19LSqhBeSDiMJGGIkuQaLnuFCVFdFrMvO',
  sheetId:'15pgn1jsxKvOPlDtADafS4rBXuRvlGumfykjb3QiSoFk',
  defaultInterval:8, minPhotos:2, thenNowFreq:8, guestWallSize:6,
};

const DEFAULT_MESSAGES = [
  {icon:'🎓',co:CONFIG.year,grad:'Graduate',name:CONFIG.name,tag:'The Adventure Continues!'},
  {icon:'✨',co:'Congratulations',grad:'Abby',name:'Class of 2026',tag:'Your future is bright'},
  {icon:'🌟',co:'With love',grad:'& pride',name:CONFIG.name,tag:'We are so proud of you'},
  {icon:'🎉',co:CONFIG.year,grad:'Graduate',name:'Abby Whitsitt',tag:'Let the adventure begin'},
  {icon:'💛',co:'Always remember',grad:'how far',name:"you've come",tag:'The best is yet to come'},
  {icon:'🏆',co:'Class of 2026',grad:'Abby',name:'Whitsitt',tag:'Go conquer the world'},
];

const SEASONAL = {
  12:{theme:'christmas'}, 11:{theme:'halloween'}, 10:{theme:'halloween'},
   7:{theme:'july4'}, 6:{theme:'summer'}, 8:{theme:'summer'},
   2:{theme:'valentine'}, 3:{theme:'spring'}, 4:{theme:'spring'},
};

const DEFAULT_THEMES = ['','rose','navy','editorial','summer'];
let defaultThemeIdx = 0;

// ══════════════════════════════════════════════════
//  LAYOUT TEMPLATES — designed around real photo ratios
//  95% of photos are 3:4 portrait or 4:3 landscape.
//  Slots use object-fit:cover so they fill completely.
//  All values are % of viewport. Gap = 1%.
//  16:9 screen: portrait slot w = h * (9/16) * (3/4)
//               landscape slot w = h * (9/16) * (4/3)
// ══════════════════════════════════════════════════
const LAYOUTS = [
  // ── Portrait slot math: w = h * 0.5625 * 0.75 = h * 0.422 ──
  // ── Landscape slot math: w = h * 0.5625 * 1.333 = h * 0.75 ──
  // (viewport is 16:9, so w%/h% ratio = actual_aspect * 9/16)
  // Portrait h:98 → w:41 | Landscape h:47 → w:35 | Landscape h:98 → w:74

  // L1: portrait left + landscape right (no badge — clean)
  { slots:[{x:0,y:1,w:41,h:98,orient:'portrait'},{x:43,y:1,w:56,h:98,orient:'landscape'}],
    badge:false },

  // L2: landscape left + portrait right (no badge — clean)
  { slots:[{x:0,y:1,w:57,h:98,orient:'landscape'},{x:59,y:1,w:40,h:98,orient:'portrait'}],
    badge:false },

  // L3: 2 portraits side by side + badge
  { slots:[{x:0,y:1,w:37,h:98,orient:'portrait'},{x:38,y:1,w:37,h:98,orient:'portrait'}],
    badge:true, badgeStyle:{top:'1%',right:'0.5%',width:'23%',padding:'1rem 1.2rem'} },

  // L4: 3 portraits in a row + badge
  { slots:[{x:0,y:1,w:24,h:98,orient:'portrait'},{x:25.5,y:1,w:24,h:98,orient:'portrait'},{x:51,y:1,w:24,h:98,orient:'portrait'}],
    badge:true, badgeStyle:{bottom:'3%',right:'0.5%',width:'22%',padding:'0.9rem 1.1rem'} },

  // L5: portrait left + 2 proper 4:3 landscapes right stacked + badge
  // h:47 landscape → w:35, gap 1% → starts at 43
  { slots:[{x:0,y:1,w:41,h:98,orient:'portrait'},{x:43,y:1,w:56,h:47,orient:'landscape'},{x:43,y:51,w:56,h:47,orient:'landscape'}],
    badge:true, badgeStyle:{bottom:'3%',left:'0.5%',width:'20%',padding:'0.8rem 1rem'} },

  // L6: 2 proper 4:3 landscapes left stacked + portrait right + badge
  { slots:[{x:0,y:1,w:56,h:47,orient:'landscape'},{x:0,y:51,w:56,h:47,orient:'landscape'},{x:58,y:1,w:41,h:98,orient:'portrait'}],
    badge:true, badgeStyle:{bottom:'3%',right:'0.5%',width:'19%',padding:'0.8rem 1rem'} },

  // L7: Full-bleed single hero + badge overlay
  { slots:[{x:0,y:0,w:100,h:100,orient:'any',contain:true}],
    badge:true, badgeStyle:{bottom:'4%',left:'3%',width:'30%',padding:'1.1rem 1.5rem'} },

  // L8: 2 portraits top-left + 2 landscapes bottom + badge top-right
  // portraits: h:50, w:21 | landscapes: h:47, w:49
  { slots:[{x:0,y:1,w:21,h:50,orient:'portrait'},{x:22,y:1,w:21,h:50,orient:'portrait'},{x:0,y:53,w:49,h:46,orient:'landscape'},{x:51,y:53,w:48,h:46,orient:'landscape'}],
    badge:true, badgeStyle:{top:'1%',right:'0.5%',width:'56%',height:'50%',padding:'1.5rem 2rem',textAlign:'center'} },

  // L9: portrait left + landscape upper-right + badge lower-right (framed)
  { slots:[{x:0,y:1,w:41,h:98,orient:'portrait'},{x:43,y:1,w:56,h:47,orient:'landscape'}],
    badge:true, badgeStyle:{bottom:'1%',right:'0%',width:'56%',height:'46%',padding:'1.5rem 2rem',textAlign:'center'} },

  // L10: landscape upper-left + badge lower-left (framed) + portrait right
  { slots:[{x:0,y:1,w:56,h:47,orient:'landscape'},{x:58,y:1,w:41,h:98,orient:'portrait'}],
    badge:true, badgeStyle:{bottom:'1%',left:'0%',width:'56%',height:'46%',padding:'1.5rem 2rem',textAlign:'center'} },

  // L11: big portrait center + 4 landscapes flanking + badge
  { slots:[{x:29,y:1,w:41,h:98,orient:'portrait'},{x:0,y:1,w:27,h:47,orient:'landscape'},{x:0,y:51,w:27,h:47,orient:'landscape'},{x:72,y:1,w:27,h:47,orient:'landscape'},{x:72,y:51,w:27,h:47,orient:'landscape'}],
    badge:true, badgeStyle:{bottom:'3%',left:'0.5%',width:'26%',padding:'0.7rem 1rem'} },

  // L12: 2 portraits left + 2 landscapes right stacked + badge
  { slots:[{x:0,y:1,w:20,h:98,orient:'portrait'},{x:21.5,y:1,w:20,h:98,orient:'portrait'},{x:43,y:1,w:56,h:47,orient:'landscape'},{x:43,y:51,w:56,h:47,orient:'landscape'}],
    badge:true, badgeStyle:{bottom:'3%',right:'0.5%',width:'20%',padding:'0.8rem 1rem'} },
];

// ── Utilities ──
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function imgUrl(id){return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;}
function getMonth(f){try{const d=f.imageMediaMetadata?.time||f.createdTime;if(d)return new Date(d).getMonth()+1;}catch(e){}return null;}
function getYear(f){try{const d=f.imageMediaMetadata?.time||f.createdTime;if(d)return new Date(d).getFullYear();}catch(e){}return null;}
function applyTheme(t){document.body.className=t?`theme-${t}`:'';const el=document.getElementById('theme-indicator');if(el)el.textContent=t||'gold';}
function readTime(msg){return Math.max(8,Math.min(20,Math.ceil(msg.split(' ').length/2.5)));}
const setStatus=m=>document.getElementById('loading-status').textContent=m;
const setProgress=p=>document.getElementById('loading-bar').style.width=p+'%';

// ── Drive fetch ──
const IMAGE_TYPES=['image/jpeg','image/jpg','image/png','image/webp','image/heic','image/heif'];
async function fetchFiles(folderId){
  let files=[],pageToken=null;
  do {
    let url=`https://www.googleapis.com/drive/v3/files?q=%27${folderId}%27+in+parents+and+trashed%3Dfalse&fields=nextPageToken,files(id,name,mimeType,createdTime,imageMediaMetadata)&pageSize=1000&key=${CONFIG.apiKey}`;
    if(pageToken)url+=`&pageToken=${encodeURIComponent(pageToken)}`;
    const res=await fetch(url);
    if(!res.ok){const e=await res.json();throw new Error(e.error?.message||`Drive API ${res.status}`);}
    const data=await res.json();
    files=files.concat((data.files||[]).filter(f=>IMAGE_TYPES.includes(f.mimeType)));
    pageToken=data.nextPageToken||null;
  }while(pageToken);
  return files;
}

// ── Sheet fetch ──
async function fetchApprovedMessages(){
  try {
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetId}/values/A:G?key=${CONFIG.apiKey}`;
    const res=await fetch(url);const data=await res.json();
    const rows=data.values||[];if(rows.length<2)return[];
    const h=rows[0].map(x=>x.toLowerCase().trim());
    const ni=h.indexOf('name'),ri=h.indexOf('relationship'),mi=h.indexOf('message'),pi=h.indexOf('photo_url'),ai=h.indexOf('approved');
    return rows.slice(1).filter(r=>r[ai]==='TRUE').map(r=>({name:r[ni]||'',relationship:r[ri]||'',message:r[mi]||'',photoUrl:r[pi]||''})).filter(r=>r.message);
  }catch(e){console.warn('Sheet fetch failed',e);return[];}
}

// ── Badge message rotation — shuffle queue so no repeats ──
let _badgeQueue=[];
function nextBadgeMsg(approvedMessages){
  const shortApproved=approvedMessages.filter(m=>m.message.length<100);
  const pool=[...DEFAULT_MESSAGES,...shortApproved.map(m=>({_approved:true,name:m.name,relationship:m.relationship,message:m.message}))];
  if(!_badgeQueue.length)_badgeQueue=shuffle([...pool]);
  return _badgeQueue.pop()||pick(DEFAULT_MESSAGES);
}
function badgeHTML(approvedMessages){
  const m=nextBadgeMsg(approvedMessages);
  if(m._approved) return `<span class="b-msg">"${m.message}"</span><span class="b-from">— ${m.name}${m.relationship?' · '+m.relationship:''}</span>`;
  return `<span class="b-cap">${m.icon}</span><span class="b-co">${m.co}</span><span class="b-grad">${m.grad}</span><span class="b-name">${m.name}</span><span class="b-tag">${m.tag}</span>`;
}

// ── Classify photo orientation ──
function photoOrient(f){
  const w=f.imageMediaMetadata?.width||1;
  const h=f.imageMediaMetadata?.height||1;
  return w>=h ? 'landscape' : 'portrait';
}

// ── Build collage slide — strict orientation matching, badge optional ──
function buildCollageSlide(files, si, approvedMessages, themeOverride){
  const portraits  = shuffle(files.filter(f=>photoOrient(f)==='portrait'));
  const landscapes = shuffle(files.filter(f=>photoOrient(f)==='landscape'));

  // Strict fit — only pick layouts where we have EXACT orientation counts
  function canFit(layout){
    const pNeeded = layout.slots.filter(s=>s.orient==='portrait').length;
    const lNeeded = layout.slots.filter(s=>s.orient==='landscape').length;
    // No fallback — must have exactly enough of each orientation
    return portraits.length >= pNeeded && landscapes.length >= lNeeded;
  }

  const available = LAYOUTS.filter(canFit);
  // If nothing fits strictly, use simpler 1-2 photo layouts
  const fallbacks = LAYOUTS.filter(l=>l.slots.length<=2);
  const layout = pick(available.length ? available : fallbacks);

  const slide = document.createElement('div');
  slide.className = 'slide';
  const month = getMonth(files[0]);
  const seasonal = month ? SEASONAL[month] : null;
  slide.dataset.theme = seasonal ? seasonal.theme : (themeOverride||'');

  let pi=0, li=0;
  layout.slots.forEach(slot=>{
    let f;
    if(slot.orient==='portrait')       f = portraits[pi++];
    else if(slot.orient==='landscape') f = landscapes[li++];
    else                               f = files[0]; // 'any' slot — use first file
    if(!f) return;

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.setAttribute('style',`left:${slot.x}%;top:${slot.y}%;width:${slot.w}%;height:${slot.h}%;`);
    const img = document.createElement('img');
    img.src = imgUrl(f.id); img.alt=''; img.loading=si<3?'eager':'lazy';
    img.onerror = ()=>cell.style.display='none';
    cell.appendChild(img);
    slide.appendChild(cell);
  });

  // Badge is optional per layout
  if(layout.badge){
    const badge = document.createElement('div');
    badge.className = 'badge';
    Object.assign(badge.style, layout.badgeStyle, {position:'absolute'});
    badge.innerHTML = badgeHTML(approvedMessages);
    slide.appendChild(badge);
  }

  return slide;
}

// ── Then & Now ──
function buildThenNow(files){
  const byMonth={};
  files.forEach(f=>{const m=getMonth(f),y=getYear(f);if(!m||!y)return;if(!byMonth[m])byMonth[m]=[];byMonth[m].push({file:f,year:y});});
  const pairs=[];
  Object.entries(byMonth).forEach(([month,entries])=>{
    if(entries.length<2)return;
    const years=[...new Set(entries.map(e=>e.year))].sort();
    if(years.length<2)return;
    const oldest=entries.filter(e=>e.year===years[0]);
    const newest=entries.filter(e=>e.year===years[years.length-1]);
    if(oldest.length&&newest.length)pairs.push({month:parseInt(month),oldFile:pick(oldest).file,newFile:pick(newest).file,oldYear:years[0],newYear:years[years.length-1]});
  });
  return shuffle(pairs);
}

function buildThenNowSlide(pair){
  const slide=document.createElement('div');slide.className='slide then-now';
  const seasonal=SEASONAL[pair.month];slide.dataset.theme=seasonal?seasonal.theme:'';
  const old=document.createElement('div');old.className='cell-old';
  const oi=document.createElement('img');oi.src=imgUrl(pair.oldFile.id);oi.alt='';oi.loading='lazy';oi.onerror=()=>old.style.display='none';
  old.appendChild(oi);slide.appendChild(old);
  const nw=document.createElement('div');nw.className='cell-new';
  const ni=document.createElement('img');ni.src=imgUrl(pair.newFile.id);ni.alt='';ni.loading='lazy';ni.onerror=()=>nw.style.display='none';
  nw.appendChild(ni);slide.appendChild(nw);
  const label=document.createElement('div');label.className='tn-label';
  const M=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  label.innerHTML=`<div class="tn-line"></div><span class="tn-word">${M[pair.month]} ${pair.oldYear}</span><span class="tn-arrow">→</span><span class="tn-word">${M[pair.month]} ${pair.newYear}</span><div class="tn-line"></div>`;
  slide.appendChild(label);return slide;
}

// ── Featured photo ──
function buildFeaturedPhotoSlide(sub){
  const slide=document.createElement('div');slide.className='slide featured-photo';slide.dataset.duration=readTime(sub.message);
  const featImg=document.createElement('div');featImg.className='feat-img';
  const img=document.createElement('img');
  const match=sub.photoUrl.match(/\/d\/([^\/]+)\//);
  img.src=match?imgUrl(match[1]):sub.photoUrl;img.alt='';img.loading='lazy';img.onerror=()=>slide.style.display='none';
  const overlay=document.createElement('div');overlay.className='feat-overlay';
  featImg.appendChild(img);featImg.appendChild(overlay);slide.appendChild(featImg);
  const featText=document.createElement('div');featText.className='feat-text';
  featText.innerHTML=`<div class="feat-divider"></div><div class="feat-message">"${sub.message}"</div><div class="feat-from">— ${sub.name}${sub.relationship?' · '+sub.relationship:''}</div>`;
  slide.appendChild(featText);return slide;
}

// ── Guest wall — dynamic timing based on word count ──
function buildGuestWallSlides(messages){
  const slides=[];
  for(let i=0;i<messages.length;i+=CONFIG.guestWallSize){
    const chunk=messages.slice(i,i+CONFIG.guestWallSize);if(!chunk.length)break;
    const slide=document.createElement('div');slide.className='slide guest-wall';
    // Dynamic read time: ~2.5 words/sec, min 15s, max 30s
    const totalWords=chunk.reduce((s,m)=>s+m.message.split(' ').length,0);
    slide.dataset.duration=Math.max(15,Math.min(30,Math.ceil(totalWords/2.5)));
    const header=document.createElement('div');header.className='guest-wall-header';
    header.innerHTML=`<h2>Messages for Abby</h2><p>From the people who love her most</p>`;
    slide.appendChild(header);
    const cards=document.createElement('div');cards.className='guest-cards';
    chunk.forEach(m=>{
      const card=document.createElement('div');card.className='guest-card';
      card.innerHTML=`<div class="gc-message">"${m.message}"</div><div class="gc-from">${m.name}</div><div class="gc-rel">${m.relationship}</div>`;
      cards.appendChild(card);
    });
    slide.appendChild(cards);slides.push(slide);
  }
  return slides;
}

// ── Build show ──
function buildShowFromData(mainFiles, submittedFiles, approvedMessages){
  const showEl=document.getElementById('show');const dotsEl=document.getElementById('dots');
  showEl.innerHTML='';dotsEl.innerHTML='';
  _badgeQueue=[];// reset badge queue each loop

  const shuffled=shuffle(mainFiles);
  const thenNowPairs=buildThenNow(mainFiles);let thenNowIdx=0;

  // Chunk photos matching layout slot counts
  const chunks=[];
  let i=0;
  while(i<shuffled.length){
    const layout=pick(LAYOUTS);
    const n=layout.slots.length;
    const chunk=shuffled.slice(i,i+n);
    if(chunk.length>=CONFIG.minPhotos) chunks.push(chunk);
    else if(chunks.length) chunks[chunks.length-1].push(...chunk);
    i+=n;
  }

  const featuredSlides=approvedMessages.filter(m=>m.photoUrl).map(buildFeaturedPhotoSlide);
  const messageOnly=approvedMessages.filter(m=>!m.photoUrl);
  const guestWalls=buildGuestWallSlides(approvedMessages);

  const allSlides=[];
  chunks.forEach((chunk,ci)=>{
    if(ci%5===0&&ci>0) defaultThemeIdx=(defaultThemeIdx+1)%DEFAULT_THEMES.length;
    allSlides.push({type:'collage',chunk,theme:DEFAULT_THEMES[defaultThemeIdx]});
    if(ci%CONFIG.thenNowFreq===CONFIG.thenNowFreq-1&&thenNowIdx<thenNowPairs.length)
      allSlides.push({type:'thenNow',pair:thenNowPairs[thenNowIdx++]});
    if(ci%6===5&&featuredSlides.length){const f=featuredSlides.shift();if(f)allSlides.push({type:'featured',el:f});}
  });
  guestWalls.forEach(w=>allSlides.push({type:'guestWall',el:w}));

  const rendered=[];
  allSlides.forEach((item,si)=>{
    let slide;
    if(item.type==='collage') slide=buildCollageSlide(item.chunk,si,messageOnly,item.theme);
    else if(item.type==='thenNow') slide=buildThenNowSlide(item.pair);
    else slide=item.el;
    if(si===0)slide.classList.add('active');
    showEl.appendChild(slide);rendered.push(slide);
    if(allSlides.length<=60){
      const dot=document.createElement('div');dot.className=`dot${si===0?' active':''}`;
      dot.onclick=()=>{clearAuto();goTo(si);startAuto();};dotsEl.appendChild(dot);
    }
  });
  return rendered;
}

// ── Controller ──
let slides=[],current=0,autoTimer=null;
function getSlideInterval(s){return s.dataset.duration?parseInt(s.dataset.duration)*1000:CONFIG.defaultInterval*1000;}
function updateCounter(){document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;}
function startProgress(dur){
  const p=document.getElementById('progress');p.style.transition='none';p.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition=`width ${dur/1000}s linear`;p.style.width='100%';}));
}
function goTo(n){
  if(!slides.length)return;
  slides[current].classList.remove('active');
  const dots=document.querySelectorAll('.dot');if(dots[current])dots[current].classList.remove('active');
  current=((n%slides.length)+slides.length)%slides.length;
  slides[current].classList.add('active');if(dots[current])dots[current].classList.add('active');
  applyTheme(slides[current].dataset.theme||'');
  updateCounter();startProgress(getSlideInterval(slides[current]));
}
function next(){goTo(current+1);}
function clearAuto(){clearTimeout(autoTimer);}
function scheduleNext(){
  autoTimer=setTimeout(async()=>{
    if(current===slides.length-1){await showOutro();await refreshAndRestart();}
    else{next();scheduleNext();}
  },getSlideInterval(slides[current]));
}
function startAuto(){clearAuto();scheduleNext();}

async function showOutro(){
  return new Promise(resolve=>{
    const outro=document.getElementById('outro');outro.style.display='flex';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      outro.classList.add('visible');
      setTimeout(()=>{outro.classList.remove('visible');setTimeout(()=>{outro.style.display='none';resolve();},1600);},10000);
    }));
  });
}

async function refreshAndRestart(){
  try{
    const[mf,sf,am]=await Promise.all([fetchFiles(CONFIG.mainFolderId),fetchFiles(CONFIG.subFolderId),fetchApprovedMessages()]);
    slides=buildShowFromData(mf,sf,am);current=0;goTo(0);startAuto();
  }catch(e){console.error('Refresh failed',e);current=0;goTo(0);startAuto();}
}

document.addEventListener('click',()=>{clearAuto();next();scheduleNext();});
document.addEventListener('touchend',e=>{e.preventDefault();clearAuto();next();scheduleNext();},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){clearAuto();next();scheduleNext();}
  if(e.key==='ArrowLeft'){clearAuto();goTo(current-1);scheduleNext();}
  if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.();
});
navigator.wakeLock?.request('screen').catch(()=>{});

// ── Particles ──
const canvas=document.getElementById('particle-canvas');const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}resize();window.addEventListener('resize',resize);
class Particle{
  constructor(){this.reset(true);}
  reset(init=false){this.x=Math.random()*canvas.width;this.y=init?Math.random()*canvas.height:-20;this.r=Math.random()*5+2;this.speed=Math.random()*1.2+.4;this.angle=Math.random()*Math.PI*2;this.spin=(Math.random()-.5)*.07;this.wobble=Math.random()*Math.PI*2;this.wobbleSpeed=Math.random()*.035+.01;this.shape=Math.random()>.4?'rect':'circle';this.w=Math.random()*7+3;this.h=Math.random()*13+5;this.alpha=Math.random()*.5+.3;}
  getColor(){return getComputedStyle(document.body).getPropertyValue(pick(['--p1','--p2','--p3','--p4'])).trim()||'#F0C040';}
  update(){this.wobble+=this.wobbleSpeed;this.angle+=this.spin;this.y+=this.speed;this.x+=Math.sin(this.wobble)*.65;if(this.y>canvas.height+20)this.reset();}
  draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.fillStyle=this.getColor();ctx.globalAlpha=this.alpha;if(this.shape==='rect')ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);else{ctx.beginPath();ctx.ellipse(0,0,this.r,this.r*.55,0,0,Math.PI*2);ctx.fill();}ctx.restore();}
}
const particles=Array.from({length:80},()=>new Particle());
(function drawP(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(drawP);})();

// ── Init ──
async function init(){
  try{
    setStatus('Fetching photos...');setProgress(20);
    const[mf,sf,am]=await Promise.all([fetchFiles(CONFIG.mainFolderId),fetchFiles(CONFIG.subFolderId),fetchApprovedMessages()]);
    if(!mf.length)throw new Error('No photos found in Drive folder.');
    setStatus(`${mf.length} photos · ${am.length} messages`);setProgress(70);
    slides=buildShowFromData(mf,sf,am);setProgress(100);
    const splash=document.getElementById('splash');splash.style.display='flex';
    await new Promise(r=>setTimeout(r,400));
    document.getElementById('loading').classList.add('gone');
    setTimeout(()=>document.getElementById('loading').remove(),1100);
    setTimeout(()=>{splash.classList.add('gone');setTimeout(()=>splash.remove(),1600);goTo(0);startAuto();},4000);
  }catch(err){
    console.error(err);document.getElementById('loading').style.display='none';
    const e=document.getElementById('error-screen');e.style.display='flex';
    document.getElementById('error-detail').textContent=err.message;
  }
}
init();
</script>
