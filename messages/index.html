<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages for Abby Whitsitt</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,500&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold:#F0C040; --gold2:#C9973A; --bg:#0a0a0f;
  --text:#FDF8EE; --text2:rgba(253,248,238,0.6);
  --card-bg:rgba(255,255,255,0.03);
  --card-border:rgba(240,192,64,0.12);
  --font-d:'Cormorant Garamond',serif;
  --font-t:'Cinzel',serif;
  --font-b:'Lato',sans-serif;
}

html { scroll-behavior:smooth; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  font-weight:300;
  min-height:100vh;
  overflow-x:hidden;
}

body::before {
  content:'';
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(240,192,64,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(201,151,58,0.04) 0%, transparent 60%);
  pointer-events:none;
}

/* ── Header ── */
.header {
  position:relative; z-index:1;
  text-align:center;
  padding:4rem 1.5rem 2.5rem;
  border-bottom:1px solid rgba(240,192,64,0.08);
}

.header-eyebrow {
  font-family:var(--font-t);
  font-size:.6rem;
  letter-spacing:.45em;
  color:var(--gold2);
  text-transform:uppercase;
  margin-bottom:.8rem;
}

.header h1 {
  font-family:var(--font-d);
  font-size:clamp(2.5rem,6vw,4.5rem);
  font-weight:300;
  line-height:1.1;
  color:var(--text);
}

.header h1 em {
  font-style:italic;
  color:var(--gold);
}

.header-sub {
  font-family:var(--font-t);
  font-size:.6rem;
  letter-spacing:.3em;
  color:var(--text2);
  text-transform:uppercase;
  margin-top:1rem;
}

.header-count {
  display:inline-block;
  margin-top:1.2rem;
  font-family:var(--font-d);
  font-style:italic;
  font-size:1.1rem;
  color:var(--gold2);
}

/* ── Grid ── */
.grid-wrap {
  position:relative; z-index:1;
  max-width:1400px;
  margin:0 auto;
  padding:2.5rem 1.5rem 5rem;
  columns:4 280px;
  column-gap:1.2rem;
}

/* ── Card ── */
.card {
  break-inside:avoid;
  margin-bottom:1.2rem;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:4px;
  overflow:hidden;
  transition:border-color .3s, transform .3s;
}

.card:hover {
  border-color:rgba(240,192,64,0.28);
  transform:translateY(-2px);
}

.card-photo {
  width:100%;
  display:block;
  object-fit:cover;
  max-height:320px;
  border-bottom:1px solid rgba(240,192,64,0.08);
}

.card-body {
  padding:1.2rem 1.3rem 1.4rem;
}

.card-message {
  font-family:var(--font-d);
  font-style:italic;
  font-size:clamp(1.05rem,1.8vw,1.3rem);
  color:var(--text);
  line-height:1.55;
  margin-bottom:.9rem;
}

.card-divider {
  width:32px;
  height:1px;
  background:var(--gold2);
  opacity:.5;
  margin-bottom:.75rem;
}

.card-name {
  font-family:var(--font-t);
  font-size:.62rem;
  letter-spacing:.2em;
  color:var(--gold);
  text-transform:uppercase;
  display:block;
}

.card-rel {
  font-size:.6rem;
  letter-spacing:.12em;
  color:var(--text2);
  text-transform:uppercase;
  display:block;
  margin-top:.2rem;
}

/* ── Loading / empty ── */
.state {
  position:relative; z-index:1;
  text-align:center;
  padding:6rem 2rem;
  color:var(--text2);
}

.state-icon {
  font-size:2.5rem;
  display:block;
  margin-bottom:1rem;
}

.state h2 {
  font-family:var(--font-d);
  font-style:italic;
  font-size:1.8rem;
  color:var(--text);
  margin-bottom:.5rem;
}

.state p {
  font-size:.85rem;
  line-height:1.7;
}

/* ── Footer ── */
footer {
  position:relative; z-index:1;
  text-align:center;
  padding:2rem 1.5rem;
  border-top:1px solid rgba(240,192,64,0.08);
  font-size:.58rem;
  letter-spacing:.2em;
  color:rgba(253,248,238,0.18);
  text-transform:uppercase;
}

/* ── Fade in animation ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

.card { animation:fadeUp .5s ease both; }

/* ── Mobile ── */
@media(max-width:600px){
  .grid-wrap { columns:1; padding:1.5rem 1rem 4rem; }
  .header { padding:3rem 1rem 2rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">Celebrating · Class of 2026</div>
  <h1>Messages for<em>Abby</em></h1>
  <div class="header-sub">From the people who love her most</div>
  <div class="header-count" id="count"></div>
</div>

<div id="main"></div>

<footer>abbywhitsitt.com &nbsp;·&nbsp; Class of 2026</footer>

<script>
const SHEET_ID = '15pgn1jsxKvOPlDtADafS4rBXuRvlGumfykjb3QiSoFk';
const API_KEY  = 'AIzaSyD1dmwLLb63ePWsWUz_FRRK4n89wxPod6Q';

function imgUrl(fileUrl){
  const match = fileUrl.match(/\/d\/([^\/]+)\//);
  if(!match) return null;
  return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
}

async function load(){
  const main = document.getElementById('main');

  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/A:G?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const rows = data.values || [];
    if(rows.length < 2){ showEmpty(main); return; }

    const h = rows[0].map(x=>x.toLowerCase().trim());
    const ni=h.indexOf('name'), ri=h.indexOf('relationship'),
          mi=h.indexOf('message'), pi=h.indexOf('photo_url'), ai=h.indexOf('approved');

    const approved = rows.slice(1).filter(r=>r[ai]==='TRUE' && r[mi] && r[mi].trim());

    if(!approved.length){ showEmpty(main); return; }

    // Update count
    document.getElementById('count').textContent =
      approved.length === 1 ? '1 message' : `${approved.length} messages`;

    // Build grid
    const grid = document.createElement('div');
    grid.className = 'grid-wrap';

    approved.forEach((r, i) => {
      const name    = r[ni] || '';
      const rel     = r[ri] || '';
      const message = r[mi] || '';
      const photoUrl = r[pi] || '';

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${Math.min(i * 0.04, 0.6)}s`;

      let photoHTML = '';
      if(photoUrl){
        const thumb = imgUrl(photoUrl);
        if(thumb) photoHTML = `<img class="card-photo" src="${thumb}" alt="" loading="lazy" onerror="this.style.display='none'">`;
      }

      card.innerHTML = `
        ${photoHTML}
        <div class="card-body">
          <div class="card-message">"${message}"</div>
          <div class="card-divider"></div>
          <span class="card-name">${name}</span>
          ${rel ? `<span class="card-rel">${rel}</span>` : ''}
        </div>
      `;

      grid.appendChild(card);
    });

    main.appendChild(grid);

  } catch(err) {
    console.error(err);
    main.innerHTML = `
      <div class="state">
        <span class="state-icon">⚠</span>
        <h2>Could not load messages</h2>
        <p>${err.message}</p>
      </div>`;
  }
}

function showEmpty(main){
  document.getElementById('count').textContent = '';
  main.innerHTML = `
    <div class="state">
      <span class="state-icon">✦</span>
      <h2>Messages are on their way</h2>
      <p>Check back soon — notes for Abby will appear here as they come in.</p>
    </div>`;
}

load();
</script>
</body>
</html>
